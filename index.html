<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umang Bagadi · GenAI Engineer</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="description" content="Umang Bagadi, GenAI Engineer. LLM agents, RAG, evaluation and guardrails.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
/* pick the theme before first paint: ?theme= in the link, else the visitor's saved choice, else lavender */
(function(){var T=["lavender","paper","ocean"],t=new URLSearchParams(location.search).get("theme");
if(T.indexOf(t)<0){try{t=localStorage.getItem("theme")}catch(e){}}
if(T.indexOf(t)<0)t="lavender";
document.documentElement.dataset.theme=t;document.documentElement.classList.add("js")})();
</script>
<style>
/* ================= THEMES ================= */
:root,[data-theme="paper"]{
  --bg:#f3efe6; --card:#fbf9f4; --soft:#e9e3d6; --line:#ddd6c7; --line-2:#c9c0ad;
  --ink:#1c1b18; --ink-2:#56534b; --ink-3:#8b877c;
  --a1:#d4572a; --a2:#2e6e60; --a3:#e3a72f;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 18px 40px -24px rgba(60,40,10,.35);
}
[data-theme="lavender"]{
  --bg:#eeebf6; --card:#f9f8fd; --soft:#e2dcf1; --line:#d8d1ea; --line-2:#c1b7dd;
  --ink:#1d1a2c; --ink-2:#55506b; --ink-3:#8a85a0;
  --a1:#6a4bd6; --a2:#c4507a; --a3:#e0a43a;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 18px 40px -24px rgba(50,30,110,.35);
}
[data-theme="ocean"]{
  --bg:#0e1726; --card:#15213a; --soft:#1c2b4a; --line:#233457; --line-2:#31477a;
  --ink:#eaf0fb; --ink-2:#a7b4cf; --ink-3:#6e7d9c;
  --a1:#ff7a59; --a2:#5ad1c4; --a3:#ffd166;
  --ca:#b3304a; /* contact card is light in this theme, so its accent must be dark enough to read */
  --shadow:0 1px 0 rgba(255,255,255,.02),0 18px 40px -24px rgba(0,0,0,.9);
}
:root{
  --serif:"Fraunces",Georgia,serif; --sans:Inter,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --w:1180px; --ease:cubic-bezier(.2,.7,.2,1); --spring:var(--ease);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background-color .5s,color .5s}
/* nothing may widen the page sideways (tilted art, the band) */
@supports (overflow:clip){html,body{overflow-x:clip}}
a{color:inherit}
::selection{background:var(--a1);color:var(--card)}
.wrap{max-width:var(--w);margin:0 auto;padding:0 28px}
.serif{font-family:var(--serif)}

/* reveal on scroll */
.js .rv{opacity:0;transform:translateY(16px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0ms)}
.js .rv.in{opacity:1;transform:none}

/* buttons, links, pills */
.btn{display:inline-flex;align-items:center;gap:10px;font:500 15px var(--sans);text-decoration:none;border-radius:999px;padding:12px 24px;border:1.5px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;transition:background-color .2s,color .2s,border-color .2s,transform .15s var(--ease)}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.menu-btn:focus-visible,.copy:focus-visible,.themes button:focus-visible{outline:2px solid var(--a1);outline-offset:3px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{background:color-mix(in srgb,var(--ink) 82%,var(--bg));border-color:color-mix(in srgb,var(--ink) 82%,var(--bg))}
.btn .ar{display:inline-block;transition:transform .3s var(--ease)}
.btn:hover .ar{transform:translate(2px,-2px)}
.ul{text-decoration:none;background:linear-gradient(var(--a1),var(--a1)) 0 100%/0 2px no-repeat;transition:background-size .4s var(--ease),color .3s}
.ul:hover{background-size:100% 2px}
.pill{display:inline-block;font:500 12px var(--mono);padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink-2);transition:background-color .3s,color .3s}

.progress{position:fixed;top:0;left:0;right:0;height:3px;background:var(--a1);transform-origin:0 50%;transform:scaleX(var(--p,0));z-index:80}

/* ================= NAV + MENU ================= */
.nav{position:fixed;inset:0 0 auto;z-index:60;transition:transform .5s var(--ease),background-color .4s,box-shadow .4s}
.nav.solid{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
.nav.hide{transform:translateY(-100%)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:76px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:600 18px var(--serif);letter-spacing:-.01em}
.brand svg{width:28px;height:28px;border-radius:8px}
.themes{display:flex;gap:6px;margin-left:auto;padding:5px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.themes button{width:20px;height:20px;border-radius:50%;border:0;cursor:pointer;padding:0;position:relative}
.themes button:hover::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--line-2)}
.themes button[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--ink)}
.themes [data-t="paper"]{background:conic-gradient(#d4572a 0 33%,#2e6e60 0 66%,#f3efe6 0)}
.themes [data-t="lavender"]{background:conic-gradient(#6a4bd6 0 33%,#c4507a 0 66%,#eeebf6 0)}
.themes [data-t="ocean"]{background:conic-gradient(#ff7a59 0 33%,#5ad1c4 0 66%,#0e1726 0)}
.menu-btn{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 18px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font:500 14px var(--sans);cursor:pointer;position:relative;z-index:71;transition:background-color .2s}
.menu-btn:hover{background:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.menu-btn i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bg);position:relative}
.menu-btn i::before,.menu-btn i::after{content:"";position:absolute;width:12px;height:1.5px;background:var(--ink);transition:transform .4s var(--ease)}
.menu-btn i::before{transform:translateY(-3px)}
.menu-btn i::after{transform:translateY(3px)}
.menu-open .menu-btn i::before{transform:rotate(45deg)}
.menu-open .menu-btn i::after{transform:rotate(-45deg)}
.menu-open .nav{z-index:75;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;transform:none}
.menu-open .brand{color:var(--bg)}
.menu-open .nav .themes{visibility:hidden}
.menu-open .menu-btn{background:var(--bg);color:var(--ink)}
.menu-open .menu-btn i{background:var(--ink)}
.menu-open .menu-btn i::before,.menu-open .menu-btn i::after{background:var(--bg)}
.overlay{position:fixed;inset:0;z-index:70;background:var(--ink);color:var(--bg);clip-path:circle(0 at var(--ox,95%) var(--oy,5%));transition:clip-path .8s var(--ease);visibility:hidden}
.menu-open .overlay{clip-path:circle(150% at var(--ox,95%) var(--oy,5%));visibility:visible}
.overlay .wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:40px}
.overlay nav a{display:flex;align-items:baseline;gap:18px;text-decoration:none;font:400 clamp(44px,7vw,92px)/1.08 var(--serif);letter-spacing:-.02em;opacity:0;transform:translateY(30px);transition:opacity .5s,transform .6s var(--ease),color .3s}
.overlay nav a small{font:500 13px var(--mono);opacity:.5}
.overlay nav a:hover{color:var(--a3)}
.menu-open .overlay nav a{opacity:1;transform:none;transition-delay:calc(.25s + var(--i)*60ms)}
.overlay aside{font-size:15px;opacity:0;transition:opacity .5s .5s}
.menu-open .overlay aside{opacity:1}
.overlay aside p{margin:0 0 4px;opacity:.6;font:500 14px var(--sans)}
.overlay aside a{display:block;text-decoration:none;font:400 24px/1.6 var(--serif)}
.overlay aside a:hover{color:var(--a3)}
.overlay aside div{margin-bottom:28px}

/* ================= HERO ================= */
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:130px 0 80px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:64px;align-items:center;width:100%}
.status{display:flex;align-items:center;gap:8px;font:400 14px var(--sans);color:var(--ink-3);margin:24px 0 0}
.status i{width:8px;height:8px;border-radius:50%;background:var(--a2)}
.hello{font:400 clamp(20px,2vw,24px) var(--serif);color:var(--ink-3);margin:0 0 8px}
.name{font:600 clamp(58px,8.2vw,124px)/.95 var(--serif);letter-spacing:-.035em;margin:0;font-variation-settings:"opsz" 144}
.name .dot{color:var(--a1)}
.name .c{display:inline-block}
.role{font:400 clamp(30px,3.6vw,52px)/1.1 var(--serif);letter-spacing:-.02em;margin:10px 0 0;color:var(--ink-2)}
.mark{position:relative;display:inline-block;color:var(--ink)}
.mark svg{position:absolute;left:-4%;bottom:-.22em;width:108%;height:.42em;overflow:visible}
.mark path{fill:none;stroke:var(--a1);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.lead{font-size:clamp(17px,1.4vw,19px);color:var(--ink-2);max-width:46ch;margin:24px 0 0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
/* hero load sequence (fallback runs at 3s if the script never does) */
.js .h-in{opacity:0;transform:translateY(16px);animation:hin2 .9s var(--ease) 3s forwards}
.go .h-in{animation:hin .9s var(--ease) var(--d,0ms) forwards}
@keyframes hin{to{opacity:1;transform:none}}
@keyframes hin2{to{opacity:1;transform:none}}
.js .name .c{opacity:0;transform:translateY(16px);animation:cin2 .8s var(--ease) 3s forwards}
.go .name .c{animation:cin .8s var(--ease) calc(150ms + var(--i)*25ms) forwards}
@keyframes cin{to{opacity:1;transform:none}}
@keyframes cin2{to{opacity:1;transform:none}}
.settled .name .c{animation:none;opacity:1;transform:none}
.go .mark path{transition:stroke-dashoffset .9s var(--ease) .9s;stroke-dashoffset:0}

/* generative art */
.art{position:relative;aspect-ratio:4/5;max-width:460px;justify-self:center;width:100%}
.frame{position:absolute;inset:0;background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);transform:rotate(2deg)}
.frame svg{width:100%;height:100%;display:block;border-radius:10px}
.tile{transition:opacity .9s var(--ease)}
.sticker{position:absolute;font:600 14px var(--sans);padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);white-space:nowrap;cursor:default}
.sticker:nth-of-type(1){left:-26px;top:14%;rotate:-8deg}
.sticker:nth-of-type(2){right:-22px;top:46%;rotate:6deg}
.sticker:nth-of-type(3){left:12%;bottom:-16px;rotate:-3deg}
.js .art{opacity:0;transform:translateY(16px);animation:hin2 1s var(--ease) 3s forwards}
.go .art{animation:artin .9s var(--ease) .3s forwards}
@keyframes artin{to{opacity:1;transform:none}}

/* ================= BAND ================= */
.band{overflow:hidden;padding:20px 0;background:var(--ink);color:var(--bg);rotate:-1.2deg;margin:30px -20px;white-space:nowrap}
.band .track{display:inline-block;will-change:transform}
.band span{font:500 clamp(22px,2.6vw,34px)/1 var(--serif);letter-spacing:-.01em}
.band span:nth-child(4n+3){color:var(--a3)}
.band b{display:inline-block;width:12px;height:12px;margin:0 22px;vertical-align:.12em;background:var(--a1);border-radius:3px;rotate:45deg}

/* ================= SECTIONS ================= */
section.sec{padding:clamp(90px,14vh,150px) 0}
.sh{display:flex;align-items:center;gap:16px;margin:0 0 50px}
.sh .glyph{width:46px;height:46px;border-radius:12px;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.sh h2{font:500 clamp(40px,5.2vw,68px)/1 var(--serif);margin:0;letter-spacing:-.03em}
.sh h2 em{color:var(--a1)}
.sh .sub{margin-left:auto;font:500 13px var(--mono);color:var(--ink-3)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:64px;align-items:start}
.about .big{font:400 clamp(24px,2.6vw,34px)/1.35 var(--serif);letter-spacing:-.01em;margin:0 0 26px}
.about .big em{font-style:italic;color:var(--a1)}
.about p{color:var(--ink-2);margin:0 0 16px;max-width:58ch}
.facts{background:var(--card);border-radius:20px;padding:10px 24px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px dashed var(--line-2);font-size:15px}
.facts div:last-of-type{border-bottom:0}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;text-align:right;font-weight:500}
.elsewhere{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.elsewhere a{font-size:14px;padding:9px 16px}

/* experience timeline */
.tl{position:relative;padding-left:46px}
.tl::before{content:"";position:absolute;left:14px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tl-fill{position:absolute;left:14px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--a1);transform-origin:top;transform:scaleY(var(--tp,0))}
.job{position:relative;margin-bottom:22px}
.job::before{content:"";position:absolute;left:-39px;top:30px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);transition:background-color .4s,border-color .4s;z-index:1}
.job.hit::before{background:var(--a1);border-color:var(--a1)}
.job .card{background:var(--card);border-radius:20px;padding:26px 28px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.job .card:hover{box-shadow:var(--shadow),inset 0 0 0 1px var(--line-2)}
.job .top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.job h3{font:500 clamp(24px,2.3vw,30px)/1.15 var(--serif);margin:0;letter-spacing:-.015em}
.job .when{margin-left:auto;font:500 13px var(--mono);color:var(--ink-3)}
.job .org{color:var(--ink);font-weight:500;margin-top:4px}
.job .org span{color:var(--ink-3);font-weight:400}
.job p{color:var(--ink-2);margin:10px 0 14px}
.job .pills{display:flex;flex-wrap:wrap;gap:6px}
.job .pills:empty{display:none}
.type{font:500 12px var(--sans);padding:4px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-2)}

/* skills tree */
.tree{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 110px;align-items:center}
.tree svg.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tree .wire{fill:none;stroke:var(--line-2);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke .35s,stroke-width .35s,opacity .35s}
.js .tree:not(.in) .wire{stroke-dashoffset:1}
.js .tree.in .wire{transition:stroke-dashoffset 1.1s var(--ease) var(--wd,0ms),stroke .35s,stroke-width .35s,opacity .35s}
.tree .wire.lit{stroke:var(--a1);stroke-width:2.2}
.tree.dim .wire:not(.lit){opacity:.35}
.root{position:relative;z-index:1;font:600 22px var(--serif);padding:16px 24px;border-radius:18px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.branches{display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
.branch{display:grid;grid-template-columns:190px minmax(0,1fr);gap:70px;align-items:center}
.gnode{font:600 16px var(--sans);padding:12px 16px;border-radius:14px;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);cursor:default;transition:background-color .2s,color .2s}
.leaves{display:flex;flex-wrap:wrap;gap:8px 8px}
.leaf{font:500 14px var(--sans);padding:8px 12px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:background-color .2s,color .2s,box-shadow .2s}
.branch.on .gnode{background:var(--a1);color:#fff}
.branch.on .leaf{box-shadow:inset 0 0 0 1.5px var(--a1)}
.leaf:hover{background:var(--a1);color:#fff}
.tree.dim .branch:not(.on){opacity:.45}
.branch{transition:opacity .35s}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:22px}
.proj{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.proj:hover{box-shadow:var(--shadow),inset 0 0 0 1.5px var(--ink)}
.proj .cover{display:block;aspect-ratio:16/7;background:var(--soft);overflow:hidden}
.proj .cover svg{width:100%;height:100%;display:block;transition:transform .5s var(--ease)}
.proj:hover .cover svg{transform:scale(1.03)}
.proj .bd{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.proj .meta{display:flex;justify-content:space-between;align-items:center;font:500 12px var(--mono);color:var(--ink-3);margin-bottom:8px}
.proj .go{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--ink);font-size:14px;transition:background-color .2s,color .2s}
.proj:hover .go{background:var(--ink);color:var(--bg)}
.proj h3{font:500 26px/1.15 var(--serif);margin:0 0 8px;letter-spacing:-.015em}
.proj p{color:var(--ink-2);margin:0 0 18px;font-size:15px}
.proj .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.proj .links{display:flex;gap:16px;margin-top:14px;font-size:14px;position:relative;z-index:2}
.proj a.cover-link{position:absolute;inset:0;z-index:1}
.proj.hidden{display:none}
.more{display:flex;gap:12px;justify-content:center;margin-top:40px;flex-wrap:wrap}

/* recognition */
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px}
.award{background:var(--card);border-radius:18px;padding:22px 22px 20px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.award .yr{font:500 12px var(--mono);color:var(--a1)}
.award b{display:block;font:500 21px/1.25 var(--serif);margin:10px 0 6px;letter-spacing:-.01em}
.award small{color:var(--ink-3);font-size:14px}

/* contact */
.contact{padding:clamp(100px,16vh,160px) 0 clamp(70px,10vh,110px)}
.contact .box{position:relative;background:var(--ink);color:var(--bg);border-radius:32px;padding:clamp(40px,6vw,80px);overflow:hidden}
.contact .box svg.bg{position:absolute;right:-60px;top:-60px;width:340px;height:340px;opacity:.9}
.contact h2{font:500 clamp(44px,6.6vw,92px)/1 var(--serif);margin:0;letter-spacing:-.035em;max-width:11ch;position:relative}
.contact h2 em{color:var(--ca,var(--a3));font-style:normal}
.contact p{position:relative;margin:22px 0 32px;max-width:44ch;opacity:.75;font-size:clamp(17px,1.4vw,19px)}
.mailrow{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mail{font:400 clamp(22px,2.4vw,32px) var(--serif);text-decoration:none;border-bottom:2px solid var(--ca,var(--a3));padding-bottom:2px}
.copy{font:500 13px var(--sans);padding:9px 14px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:var(--bg);cursor:pointer;transition:background-color .3s,color .3s}
.copy:hover{background:var(--bg);color:var(--ink)}
.copy.ok{background:var(--a2);border-color:var(--a2);color:#fff}
.contact .soc{position:relative;display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.contact .soc .btn{border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg)}
.contact .soc .btn:hover{background:var(--bg);color:var(--ink);border-color:var(--bg)}

footer{padding:26px 0 40px;font-size:14px;color:var(--ink-3)}
footer .wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
footer .clock{display:inline-flex;align-items:center;gap:8px}
footer .clock i{width:7px;height:7px;border-radius:50%;background:var(--a2)}
footer .top{margin-left:auto;text-decoration:none;color:var(--ink-2)}
footer .top:hover{color:var(--a1)}

/* ================= SCROLL EFFECTS (only ones that explain something) ================= */
/* about: the statement lights up as you read it */
.js .about .big .w{color:var(--ink-3);transition:color .3s}
.js .about .big .w.on{color:var(--ink)}
/* skills: groups and items fade in after their branches draw */
.js .tree .leaf,.js .tree .gnode{opacity:0}
.js .tree.in .leaf,.js .tree.in .gnode{opacity:1;transition:opacity .5s var(--ease) var(--ld,0ms),background-color .2s,color .2s,box-shadow .2s}
.js .tree.in.settled-tree .leaf,.js .tree.in.settled-tree .gnode{transition:opacity .2s,background-color .2s,color .2s,box-shadow .2s}

@media (max-width:980px){
  .hero .wrap,.about{grid-template-columns:1fr}
  .art{max-width:380px;margin-top:20px}
  .tree{grid-template-columns:1fr;gap:18px}
  .tree svg.wires{display:none}
  .root{justify-self:start}
  .branches{border-left:2px solid var(--line);padding-left:20px;margin-left:24px}
  .branch{grid-template-columns:1fr;gap:10px;position:relative}
  .branch::before{content:"";position:absolute;left:-20px;top:22px;width:16px;height:2px;background:var(--line)}
  .gnode{justify-self:start}
  .overlay .wrap{grid-template-columns:1fr;align-content:center}
}
@media (max-width:640px){
  .wrap{padding:0 18px}
  .band{margin:24px 0}
  .art{max-width:330px}
  .frame{transform:rotate(1deg)}
  .contact .box{padding-bottom:120px}
  .contact .box svg.bg{width:130px;height:130px;right:-34px;top:auto;bottom:-34px;opacity:.55}
  .contact h2{max-width:none}
  .themes{display:none}
  .menu-btn{margin-left:auto}
  .hero{padding-top:110px}
  .sticker{font-size:12px;padding:7px 12px}
  .sticker:nth-of-type(1){left:-6px}.sticker:nth-of-type(2){right:-6px}
  .tl{padding-left:34px}.tl::before,.tl-fill{left:8px}.job::before{left:-33px}
  .job .card{padding:22px 20px}
  .job .when{margin-left:0;width:100%}
  .sh .sub{display:none}
  .overlay .menu-themes{display:flex}
}
.menu-themes{display:none;margin-top:6px}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .rv,.js .h-in,.js .name .c,.js .art,.js .tree .leaf,.js .tree .gnode{opacity:1;transform:none;animation:none;transition:none}
  .js .about .big .w{color:var(--ink)}
  .mark path{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div class="progress" id="prog" aria-hidden="true"></div>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="brand" href="#top"><span id="brand-mark"></span><span id="brand-name"></span></a>
    <div class="themes" id="themes" role="group" aria-label="Colour theme">
      <button data-t="lavender" title="Lavender" aria-label="Lavender theme"></button>
      <button data-t="paper" title="Paper" aria-label="Paper theme"></button>
      <button data-t="ocean" title="Ocean" aria-label="Ocean theme"></button>
    </div>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="overlay"><span id="menu-label">Menu</span><i></i></button>
  </div>
</header>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="wrap">
    <nav id="menu-links">
      <a href="#about" style="--i:0"><small>01</small>About</a>
      <a href="#experience" style="--i:1"><small>02</small>Experience</a>
      <a href="#skills" style="--i:2"><small>03</small>Skills</a>
      <a href="#projects" style="--i:3"><small>04</small>Projects</a>
      <a href="#contact" style="--i:4"><small>05</small>Contact</a>
    </nav>
    <aside id="menu-aside"></aside>
  </div>
</div>

<main>
  <section class="hero" id="top">
    <div class="wrap">
      <div>
        <p class="hello h-in" style="--d:100ms">Hello, I'm</p>
        <h1 class="name" id="name"></h1>
        <p class="role h-in" style="--d:550ms" id="role"></p>
        <p class="lead h-in" style="--d:650ms" id="intro"></p>
        <div class="cta h-in" style="--d:750ms">
          <a class="btn pri" id="hero-resume" target="_blank" rel="noopener">View résumé <span class="ar">↗</span></a>
          <a class="btn" href="#projects">See my work</a>
        </div>
        <p class="status h-in" style="--d:850ms"><i></i><span id="status"></span></p>
      </div>
      <div class="art" id="art" aria-hidden="true">
        <div class="frame"><svg id="art-svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"></svg></div>
      </div>
    </div>
  </section>

  <div class="band" aria-hidden="true"><div class="track" id="band"></div></div>

  <section class="sec" id="about"><div class="wrap">
    <div class="sh rv"><span class="glyph" data-seed="about"></span><h2>About</h2></div>
    <div class="about">
      <div id="about-text"></div>
      <div class="rv" style="--d:150ms">
        <dl class="facts" id="facts"></dl>
        <div class="elsewhere" id="elsewhere"></div>
      </div>
    </div>
  </div></section>

  <section class="sec" id="experience"><div class="wrap">
    <div class="sh rv"><span class="glyph" data-seed="experience"></span><h2>Experience</h2><span class="sub" id="xp-span"></span></div>
    <div class="tl" id="tl"><div class="tl-fill" id="tl-fill"></div></div>
  </div></section>

  <section class="sec" id="skills"><div class="wrap">
    <div class="sh rv"><span class="glyph" data-seed="skills"></span><h2>Skills</h2><span class="sub">Hover a group</span></div>
    <div class="tree rv" id="tree"><svg class="wires" id="tree-wires"></svg><div class="root">Skills</div><div class="branches" id="branches"></div></div>
  </div></section>

  <section class="sec" id="projects"><div class="wrap">
    <div class="sh rv"><span class="glyph" data-seed="projects"></span><h2>Projects</h2><span class="sub" id="proj-count"></span></div>
    <div class="projects" id="proj-grid"></div>
    <div class="more rv" id="more"></div>
  </div></section>

  <section class="sec" id="recognition" style="padding-top:0"><div class="wrap">
    <div class="sh rv"><span class="glyph" data-seed="recognition"></span><h2>Recognition</h2></div>
    <div class="rec" id="rec"></div>
  </div></section>

  <section class="contact" id="contact"><div class="wrap">
    <div class="box rv">
      <svg class="bg" id="contact-art" viewBox="0 0 300 300" aria-hidden="true"></svg>
      <h2>Have a role or an idea? <em>Let's talk</em></h2>
      <p id="contact-text"></p>
      <div class="mailrow"><a class="mail" id="mail"></a><button class="copy" id="copy">Copy email</button></div>
      <div class="soc" id="contact-soc"></div>
    </div>
  </div></section>
</main>

<footer><div class="wrap"><span id="copyright"></span><span class="clock"><i></i><span id="clock"></span></span><a class="top" href="#top">Back to top ↑</a></div></footer>

<script src="data.js"></script>
<script src="fx.js"></script>
</body>
</html>
