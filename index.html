<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umang Bagadi · GenAI Engineer</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="description" content="Umang Bagadi, GenAI Engineer. LLM agents, RAG, evaluation and guardrails.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f100d; --dot:#23251f; --panel:#171914; --panel-2:#1d2019; --line:#2f332a; --line-2:#3d4236;
  --ink:#ecebe3; --ink-2:#a9aa9e; --ink-3:#6f7165;
  --amber:#f2b33d; --mint:#7fd6a6; --coral:#f2735a; --lilac:#b9a3f5; --sky:#7cc4f2;
  --mono:"JetBrains Mono",ui-monospace,monospace; --serif:"Instrument Serif",Georgia,serif; --sans:Inter,system-ui,sans-serif;
  --w:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;overflow-x:hidden}
a{color:inherit}
::selection{background:var(--amber);color:var(--bg)}
.wrap{max-width:var(--w);margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}
.sw{width:8px;height:8px;border-radius:2px;background:var(--c,var(--mint));flex:none}

/* reveal on scroll (only when JS runs) */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.js .rv.in{opacity:1;transform:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font:500 13px var(--mono);text-decoration:none;border-radius:8px;padding:12px 18px;border:1px solid var(--line-2);color:var(--ink);background:var(--panel);transition:border-color .2s,color .2s,background-color .2s,transform .2s;cursor:pointer}
.btn:hover{border-color:var(--mint);color:var(--mint);transform:translateY(-1px)}
.btn.pri{background:var(--mint);color:var(--bg);border-color:var(--mint)}
.btn.pri:hover{background:#95e2b8;color:var(--bg)}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:background-color .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.solid{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-color:var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:64px}
.brand{display:flex;align-items:center;gap:9px;font:500 13px var(--mono);text-decoration:none}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 22%,transparent)}
.nav .links{display:flex;gap:22px;margin-left:auto;font:13px var(--mono)}
.nav .links a{text-decoration:none;color:var(--ink-2);transition:color .2s}
.nav .links a span{color:var(--amber)}
.nav .links a:hover,.nav .links a.on{color:var(--ink)}
.nav .btn{padding:8px 14px;font-size:12px}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line-2);border-radius:8px;width:40px;height:40px;color:var(--ink);cursor:pointer;font:16px var(--mono)}

/* ---------- hero ---------- */
.hero{min-height:100vh;display:flex;align-items:center;padding:96px 0 56px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center;width:100%}
.hi{font:14px var(--mono);color:var(--amber);margin:0 0 18px}
.hi::before{content:"$ ";color:var(--ink-3)}
.hero h1{font:400 clamp(56px,8vw,112px)/.92 var(--serif);margin:0;letter-spacing:-.015em}
.hero h2{font:italic 400 clamp(30px,4vw,54px)/1.02 var(--serif);margin:14px 0 0;color:var(--ink-2)}
.hero h2 em{color:var(--amber)}
.hero p.lead{max-width:46ch;color:var(--ink-2);margin:26px 0 0;font-size:16px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:28px;font:12px var(--mono);color:var(--ink-3)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mint) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

/* decorative agent graph (does not depend on any project) */
.graph{position:relative;width:100%;aspect-ratio:560/400}
.graph .inner{position:absolute;left:0;top:0;width:560px;height:400px;transform-origin:0 0}
.graph svg{position:absolute;inset:0;overflow:visible}
.wire{fill:none;stroke:var(--line-2);stroke-width:1.5}
.g-node{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px -14px rgba(0,0,0,.8);transition:border-color .3s,box-shadow .3s;font:12px var(--mono)}
.g-node.lit{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 26px -6px var(--c)}
.g-node .hd{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--ink-3);border-radius:10px 10px 0 0;background:linear-gradient(to right,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%)}
.g-node .hd b{margin-left:auto;font-weight:400}
.g-node .bd{padding:9px 11px;color:var(--ink-2)}
.g-node.tool{display:flex;align-items:center;gap:8px;padding:12px 11px;color:var(--ink)}
.g-node.tool .st{margin-left:auto;color:var(--ink-3)}
.g-node.tool.done .st{color:var(--mint)}
.g-node .q{color:var(--amber)}
.g-node .nm{font:400 26px/1 var(--serif);color:var(--ink)}
.g-node .ans b{color:var(--mint);font-weight:400}

/* ---------- sections ---------- */
section.sec{padding:clamp(80px,13vh,140px) 0}
.sh{margin:0 0 40px}
.sh .n{display:inline-flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--ink-3);border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px}
.sh .n::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c,var(--mint))}
.sh h3{font:400 clamp(40px,5.4vw,64px)/1 var(--serif);margin:14px 0 0}
.sh h3 i{color:var(--amber)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px -20px rgba(0,0,0,.9)}
.card .hd{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--ink-3);border-radius:12px 12px 0 0;background:linear-gradient(to right,color-mix(in srgb,var(--c,var(--mint)) 14%,transparent),transparent 65%)}
.card .hd .r{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:11.5px var(--mono);padding:3px 9px;border:1px solid var(--line-2);border-radius:999px;color:var(--ink-2);background:var(--bg)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;align-items:start}
.about p{color:var(--ink-2);margin:0 0 18px;font-size:16px;max-width:58ch}
.who{--c:var(--mint)}
.who .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;padding:16px 18px;font:12.5px var(--mono)}
.who .kv span:nth-child(odd){color:var(--ink-3)}
.who .kv span:nth-child(even){color:var(--ink)}
.who .ft{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.who .ft a{font:12px var(--mono);text-decoration:none;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:5px 10px}
.who .ft a:hover{color:var(--mint);border-color:var(--mint)}

/* experience timeline */
.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:1.5px;background:linear-gradient(var(--mint),var(--line-2) 40%,var(--line))}
.job{position:relative;margin:0 0 22px}
.job::before{content:"";position:absolute;left:-33px;top:22px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--c);box-shadow:0 0 0 4px var(--bg)}
.job.now::before{background:var(--c);box-shadow:0 0 0 4px var(--bg),0 0 14px var(--c)}
.job .card:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.job .bd{padding:18px 20px 20px}
.job .top{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.job h4{font:400 28px/1.1 var(--serif);margin:0}
.job .when{margin-left:auto;font:12px var(--mono);color:var(--ink-3)}
.job .org{font:13px var(--mono);color:var(--c);margin-top:4px}
.job .org span{color:var(--ink-3)}
.job p{margin:12px 0 14px;color:var(--ink-2)}
.job .chips:empty{display:none}
.badge{font:10.5px var(--mono);border:1px solid var(--c);color:var(--c);border-radius:4px;padding:1px 6px}

/* skills */
.skills{--c:var(--lilac)}
.sk-row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:baseline;padding:20px 22px;border-bottom:1px solid var(--line);position:relative;transition:background-color .25s}
.sk-row:last-child{border-bottom:0}
.sk-row::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--rc);opacity:0;transition:opacity .25s}
.sk-row:hover{background:var(--panel-2)}
.sk-row:hover::before{opacity:1}
.sk-row .g{display:flex;align-items:center;gap:10px;font:13px var(--mono);color:var(--ink-3)}
.sk-row .g i{width:8px;height:8px;border-radius:2px;background:var(--rc)}
.sk-row:hover .g{color:var(--ink)}
.sk-row .it{font:400 26px/1.35 var(--serif);color:var(--ink)}
.sk-row .it span{white-space:nowrap}
.sk-row .it span:not(:last-child)::after{content:"/";color:var(--line-2);font-family:var(--sans);font-size:.7em;padding:0 .5em;vertical-align:.12em}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}
.proj{position:relative;display:flex;flex-direction:column;transition:transform .25s,border-color .25s,box-shadow .25s}
.proj:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 20px 40px -20px color-mix(in srgb,var(--c) 50%,transparent)}
.proj .bd{padding:18px 18px 16px;flex:1;display:flex;flex-direction:column}
.proj h4{font:400 28px/1.05 var(--serif);margin:0 0 10px}
.proj p{margin:0 0 18px;color:var(--ink-2);font-size:14px}
.proj .chips{margin-top:auto}
.proj .ft{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}
.proj .ft a{position:relative;z-index:2;font:12px var(--mono);text-decoration:none;border:1px solid var(--line-2);border-radius:6px;padding:5px 10px;white-space:nowrap}
.proj .ft a:hover{border-color:var(--c);color:var(--c)}
.proj a.cover{position:absolute;inset:0;z-index:1;border-radius:12px}
.proj.hidden{display:none}
.more{display:flex;gap:12px;justify-content:center;margin-top:36px;flex-wrap:wrap}

/* recognition */
.rec{--c:var(--amber)}
.rec .row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:baseline}
.rec .row:last-child{border-bottom:0}
.rec .row span{font:12px var(--mono);color:var(--ink-3)}
.rec .row b{font-weight:500}
.rec .row small{display:block;color:var(--ink-3);font-size:13px}

/* contact */
.contact{text-align:center;max-width:680px;margin:0 auto}
.contact .n{font:14px var(--mono);color:var(--amber)}
.contact h3{font:400 clamp(56px,9vw,104px)/.95 var(--serif);margin:14px 0 18px}
.contact h3 i{color:var(--amber)}
.contact p{color:var(--ink-2);margin:0 auto 34px;max-width:48ch;font-size:16px}
.contact .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:26px 0 34px;font:12px var(--mono);color:var(--ink-3)}
footer .wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
footer .soc{margin-left:auto;display:flex;gap:18px}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}

@media (max-width:900px){
  .hero .wrap,.about{grid-template-columns:1fr}
  .hero{min-height:auto;padding-top:120px}
}
@media (max-width:760px){
  .nav .links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 24px 16px}
  .nav .links a{padding:12px 0;border-bottom:1px solid var(--line)}
  .nav.open .links{display:flex}
  .nav.open{background:var(--bg)}
  .nav .resume{display:none}
  .burger{display:block}
  .sk-row{grid-template-columns:1fr;gap:6px;padding:16px 16px}
  .sk-row .it{font-size:22px}
  .job .when{margin-left:0;width:100%}
  .tl{padding-left:26px}
  .job::before{left:-25px}
  .tl::before{left:5px}
  footer .soc{margin-left:0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .rv{opacity:1;transform:none;transition:none}.status i{animation:none}}
</style>
<script>document.documentElement.classList.add("js")</script>
</head>
<body>

<nav class="nav" id="nav">
  <div class="wrap">
    <a class="brand" href="#top"><i></i>umang_bagadi</a>
    <div class="links" id="links">
      <a href="#about">about</a>
      <a href="#experience">experience</a>
      <a href="#skills">skills</a>
      <a href="#projects">projects</a>
      <a href="#contact">contact</a>
    </div>
    <a class="btn resume" id="nav-resume" target="_blank">resume ↗</a>
    <button class="burger" id="burger" aria-label="menu" aria-expanded="false">≡</button>
  </div>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <div>
      <p class="hi rv" id="hi"></p>
      <h1 class="rv" id="name"></h1>
      <h2 class="rv" id="tagline"></h2>
      <p class="lead rv" id="intro"></p>
      <div class="cta rv">
        <a class="btn pri" id="hero-resume" target="_blank">view resume ↗</a>
        <a class="btn" href="#contact">get in touch</a>
      </div>
      <div class="status rv"><i></i><span id="status"></span></div>
    </div>
    <div class="graph rv" id="graph" aria-hidden="true"><div class="inner" id="ginner"><svg id="gwires"></svg></div></div>
  </div>
</header>

<main>
  <section class="sec" id="about"><div class="wrap">
    <div class="sh rv"><span class="n" style="--c:var(--mint)">state.about</span><h3>A bit <i>about me</i></h3></div>
    <div class="about">
      <div class="rv" id="about-text"></div>
      <div class="card who rv" id="who"></div>
    </div>
  </div></section>

  <section class="sec" id="experience"><div class="wrap">
    <div class="sh rv"><span class="n" style="--c:var(--sky)">memory.checkpoints</span><h3>Where I've <i>worked</i></h3></div>
    <div class="tl" id="tl"></div>
  </div></section>

  <section class="sec" id="skills"><div class="wrap">
    <div class="sh rv"><span class="n" style="--c:var(--lilac)">tools.available</span><h3>What I <i>work with</i></h3></div>
    <div id="skill-grid"></div>
  </div></section>

  <section class="sec" id="projects"><div class="wrap">
    <div class="sh rv"><span class="n" style="--c:var(--coral)">runs.recent</span><h3>Things I've <i>built</i></h3></div>
    <div class="projects" id="proj-grid"></div>
    <div class="more rv" id="more"></div>
  </div></section>

  <section class="sec" id="recognition" style="padding-top:0"><div class="wrap">
    <div class="sh rv"><span class="n" style="--c:var(--amber)">eval.results</span><h3><i>Recognition</i></h3></div>
    <div class="card rec rv" id="rec"></div>
  </div></section>

  <section class="sec" id="contact"><div class="wrap">
    <div class="contact rv">
      <span class="n">return</span>
      <h3>Let's <i>talk.</i></h3>
      <p id="contact-text"></p>
      <div class="cta" id="contact-cta"></div>
    </div>
  </div></section>
</main>

<footer><div class="wrap"><span id="copy"></span><div class="soc" id="soc"></div></div></footer>

<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const COL=["var(--mint)","var(--sky)","var(--lilac)","var(--amber)","var(--coral)"];

/* ---------- hero ---------- */
$("hi").textContent=ME.greeting;
$("name").textContent=ME.name+".";
$("tagline").textContent=ME.role;
$("intro").textContent=ME.intro;
$("status").textContent=ME.status;
if(ME.resume){["nav-resume","hero-resume"].forEach(id=>$(id).href=ME.resume)}
else{$("nav-resume").remove();const h=$("hero-resume");h.href="#projects";h.removeAttribute("target");h.textContent="see my work ↓"}

/* ---------- about ---------- */
$("about-text").innerHTML=ABOUT.map(p=>`<p>${esc(p)}</p>`).join("");
$("who").innerHTML=`<div class="hd"><span class="sw"></span>whoami<span class="r">profile.json</span></div>
  <div class="kv"><span>name</span><span>${esc(ME.name)}</span><span>role</span><span>${esc(ME.role)}</span><span>at</span><span>${esc(ME.org)}</span><span>exp</span><span>${esc(ME.years)}</span><span>base</span><span>${esc(ME.base)}</span></div>
  <div class="ft"><a href="${ME.github}" target="_blank" rel="noopener">github</a><a href="${ME.linkedin}" target="_blank" rel="noopener">linkedin</a><a href="mailto:${ME.email}">email</a></div>`;

/* ---------- experience ---------- */
$("tl").innerHTML=EXPERIENCE.map((j,i)=>`<div class="job rv${i===0?" now":""}" style="--c:${COL[i%COL.length]}">
  <div class="card"><div class="hd"><span class="sw"></span>${esc((j.type||"").toLowerCase())}<span class="r">${i===0&&/present/i.test(j.when)?"running":"checkpoint"}</span></div>
  <div class="bd">
    <div class="top"><h4>${esc(j.role)}</h4><span class="when">${esc(j.when)}</span></div>
    <div class="org">${esc(j.org)}${j.place?` <span>· ${esc(j.place)}</span>`:""}</div>
    ${j.line?`<p>${esc(j.line)}</p>`:""}
    <div class="chips">${(j.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
  </div></div></div>`).join("");

/* ---------- skills ---------- */
$("skill-grid").innerHTML=`<div class="card skills rv"><div class="hd"><span class="sw"></span>stack<span class="r">${SKILLS.length} groups</span></div>`+
  SKILLS.map((g,i)=>`<div class="sk-row" style="--rc:${COL[i%COL.length]}"><div class="g"><i></i>${esc(g.group)}</div><div class="it">${g.items.map(x=>`<span>${esc(x)}</span>`).join(" ")}</div></div>`).join("")+`</div>`;

/* ---------- projects (generic: any number, any fields) ---------- */
const PR=PROJECTS.filter(p=>!p.hide), LIMIT=window.PROJECTS_VISIBLE||6;
$("proj-grid").innerHTML=PR.map((p,i)=>{
  const main=p.demo||p.code;
  return `<article class="card proj rv${i>=LIMIT?" hidden":""}" style="--c:${COL[i%COL.length]}">
    ${main?`<a class="cover" href="${main}" target="_blank" rel="noopener" aria-label="${esc(p.name)}"></a>`:""}
    <div class="hd"><span class="sw"></span>${p.year?esc(p.year):"project"}<span class="r">${String(i+1).padStart(2,"0")}</span></div>
    <div class="bd"><h4>${esc(p.name)}</h4><p>${esc(p.line)}</p>
      ${p.stack&&p.stack.length?`<div class="chips">${p.stack.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div>`:""}</div>
    ${p.code||p.demo?`<div class="ft">${p.code?`<a href="${p.code}" target="_blank" rel="noopener">code ↗</a>`:""}${p.demo?`<a href="${p.demo}" target="_blank" rel="noopener">live ↗</a>`:""}</div>`:""}
  </article>`}).join("");
$("more").innerHTML=(PR.length>LIMIT?`<button class="btn" id="showall">show all ${PR.length} ↓</button>`:"")+`<a class="btn" href="${ME.github}" target="_blank" rel="noopener">more on github ↗</a>`;
if($("showall")) $("showall").onclick=e=>{document.querySelectorAll(".proj.hidden").forEach(c=>{c.classList.remove("hidden");c.classList.add("in")});e.currentTarget.remove()};

/* ---------- recognition ---------- */
if(!window.RECOGNITION||!RECOGNITION.length) $("recognition").remove();
else $("rec").innerHTML=`<div class="hd"><span class="sw"></span>achievements.log<span class="r">${RECOGNITION.length} entries</span></div>`+
  RECOGNITION.map(r=>`<div class="row"><span>${esc(r.when)||"—"}</span><div><b>${esc(r.what)}</b><small>${esc(r.who)}</small></div></div>`).join("");

/* ---------- contact + footer ---------- */
$("contact-text").textContent=`I'm ${ME.status.replace(/^open/,"open")}. If you're hiring, building something with LLMs, or just want to talk agents, my inbox is open.`;
$("contact-cta").innerHTML=`<a class="btn pri" href="mailto:${ME.email}">say hello ↗</a><a class="btn" href="${ME.linkedin}" target="_blank" rel="noopener">linkedin ↗</a>`;
$("copy").textContent=`© ${new Date().getFullYear()} ${ME.name} · designed & built by hand`;
$("soc").innerHTML=`<a href="${ME.github}" target="_blank" rel="noopener">github</a><a href="${ME.linkedin}" target="_blank" rel="noopener">linkedin</a><a href="mailto:${ME.email}">email</a>`;

/* ---------- nav ---------- */
const nav=$("nav"), burger=$("burger");
burger.onclick=()=>{const o=nav.classList.toggle("open");burger.setAttribute("aria-expanded",o)};
$("links").addEventListener("click",e=>{if(e.target.closest("a")){nav.classList.remove("open");burger.setAttribute("aria-expanded",false)}});
const secs=[...document.querySelectorAll("section.sec[id]")], navLinks=[...document.querySelectorAll(".nav .links a")];
function onScroll(){
  nav.classList.toggle("solid",scrollY>20);
  let cur=""; secs.forEach(s=>{if(s.getBoundingClientRect().top<innerHeight*.4)cur=s.id});
  navLinks.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+cur));
}
addEventListener("scroll",onScroll,{passive:true}); onScroll();

/* ---------- reveal on scroll ---------- */
if("IntersectionObserver" in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".rv").forEach((el,i)=>{el.style.transitionDelay=(el.closest(".hero")?i*70:0)+"ms";io.observe(el)});
} else document.querySelectorAll(".rv").forEach(el=>el.classList.add("in"));

/* ---------- decorative agent graph in the hero ---------- */
(function graph(){
  const inner=$("ginner"), svg=$("gwires"), box=$("graph");
  const N=[
    {k:"in",  x:175,y:0,  w:210, c:"var(--amber)", html:`<div class="hd"><span class="sw"></span>input<b>str</b></div><div class="bd q">› who builds reliable agents?</div>`},
    {k:"me",  x:150,y:96, w:260, c:"var(--mint)",  html:`<div class="hd"><span class="sw"></span>agent<b>StateGraph</b></div><div class="bd"><div class="nm">${esc(ME.name)}</div>${esc(ME.role)}</div>`},
    {k:"t1",  x:0,  y:232,w:128, c:"var(--sky)",   tool:"retrieve()"},
    {k:"t2",  x:144,y:232,w:128, c:"var(--lilac)", tool:"verify()"},
    {k:"t3",  x:288,y:232,w:128, c:"var(--coral)", tool:"evaluate()"},
    {k:"t4",  x:432,y:232,w:128, c:"var(--amber)", tool:"guard()"},
    {k:"out", x:150,y:322,w:260, c:"var(--mint)",  html:`<div class="hd"><span class="sw"></span>output<b>answer</b></div><div class="bd ans">waiting…</div>`}
  ];
  const E=[["in","me"],["me","t1"],["me","t2"],["me","t3"],["me","t4"],["t1","out"],["t2","out"],["t3","out"],["t4","out"]];
  const el={};
  N.forEach(n=>{const d=document.createElement("div");d.className="g-node"+(n.tool?" tool":"");d.style.cssText=`left:${n.x}px;top:${n.y}px;width:${n.w}px;--c:${n.c}`;
    d.innerHTML=n.tool?`<span class="sw"></span>${n.tool}<span class="st">○</span>`:n.html;inner.appendChild(d);el[n.k]=d});
  const pt=(d,side)=>[d.offsetLeft+d.offsetWidth/2, side==="out"?d.offsetTop+d.offsetHeight:d.offsetTop];
  const paths={};
  function draw(){
    inner.style.transform=`scale(${box.clientWidth/560})`;
    svg.setAttribute("width",560);svg.setAttribute("height",400);
    svg.innerHTML=E.map(([a,b])=>{const p=pt(el[a],"out"),q=pt(el[b],"in"),dy=Math.max(18,(q[1]-p[1])*.5);
      return `<path class="wire" id="g-${a}-${b}" d="M${p[0]},${p[1]} C${p[0]},${p[1]+dy} ${q[0]},${q[1]-dy} ${q[0]},${q[1]}"/>`}).join("");
  }
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function packet(a,b,c,dur=650){return new Promise(res=>{const p=$(`g-${a}-${b}`);if(!p||reduce)return res();
    const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");dot.setAttribute("r",4);dot.setAttribute("fill",c);svg.appendChild(dot);
    const L=p.getTotalLength(),t0=performance.now();
    (function step(now){const k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,q=p.getPointAtLength(L*e);dot.setAttribute("cx",q.x);dot.setAttribute("cy",q.y);k<1?requestAnimationFrame(step):(dot.remove(),res())})(t0)})}
  const ans=el.out.querySelector(".ans");
  let visible=true; new IntersectionObserver(es=>visible=es[0].isIntersecting).observe(box);
  async function loop(){
    while(true){
      if(!visible||document.hidden){await sleep(600);continue}
      Object.values(el).forEach(d=>d.classList.remove("lit","done")); inner.querySelectorAll(".st").forEach(s=>s.textContent="○"); ans.textContent="thinking…";
      el.in.classList.add("lit"); await packet("in","me","#f2b33d"); el.me.classList.add("lit");
      await Promise.all(["t1","t2","t3","t4"].map(async(t,i)=>{await sleep(i*140);await packet("me",t,getComputedStyle(el[t]).getPropertyValue("--c"));
        el[t].classList.add("lit");await sleep(250+i*120);el[t].classList.add("done");el[t].querySelector(".st").textContent="✓";await packet(t,"out",getComputedStyle(el[t]).getPropertyValue("--c"))}));
      el.out.classList.add("lit"); ans.innerHTML="<b>✓</b> grounded · cited · tested";
      await sleep(3800);
    }
  }
  document.fonts.ready.then(()=>{draw();loop()});
  addEventListener("resize",draw);
})();
</script>
</body>
</html>
